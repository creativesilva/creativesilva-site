<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Camera Checkout Calendar | Pioneer Valley Photography</title>
<meta name="description" content="See which Pioneer Valley photography cameras are checked out and when they are due back." />
<link rel="icon" type="image/svg+xml" href="/logos/CS_Logo_Only_Teal.svg" />
<link rel="apple-touch-icon" href="/logos/CS_AppIcon_Teal_180.png" />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#041d1c; --bg2:#062a28; --wedge:#0a4a4a;
    --panel:linear-gradient(135deg,rgba(0,184,184,0.12) 0%,rgba(4,20,19,0.55) 100%);
    --teal:#00b8b8; --teal-lt:#5ff0f0; --teal-deep:#007474;
    --text:#eafeff; --muted:rgba(206,244,244,0.66); --faint:rgba(206,244,244,0.42);
    --line:rgba(0,184,184,0.35); --line-soft:rgba(0,184,184,0.2);
    --ok:#3fa863; --orange:#ff6b1a; --grayed:rgba(160,180,180,0.34);
    --font:'Oswald',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    --body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;border-radius:0 !important;}
  html,body{margin:0;padding:0;}
  body{background:radial-gradient(1200px 700px at -6% -12%,rgba(0,184,184,0.30),transparent 52%),
    radial-gradient(900px 560px at 106% 6%,rgba(0,184,184,0.12),transparent 55%),
    linear-gradient(135deg,var(--wedge) 0%,var(--bg2) 36%,var(--bg) 100%);
    background-attachment:fixed;color:var(--text);font-family:var(--body);min-height:100vh;line-height:1.5;}
  .wrap{max-width:1000px;margin:0 auto;padding:26px 22px 70px;}
  .top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px;}
  .top img{width:40px;height:40px;object-fit:contain;}
  h1{font-family:var(--font);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:clamp(1.3rem,4vw,1.8rem);margin:0;color:#fff;}
  .checkout-btn{margin-left:auto;font-family:var(--font);font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#04110f;background:var(--teal);border:0;padding:11px 18px;cursor:pointer;text-decoration:none;display:inline-block;}
  .checkout-btn:hover{filter:brightness(1.1);}
  .sub{color:var(--muted);font-size:.92rem;margin:2px 0 20px;}
  .summary{display:flex;align-items:center;gap:14px 22px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--teal);padding:14px 18px;margin-bottom:18px;}
  .summary .big{font-family:var(--font);font-size:1.6rem;color:var(--teal-lt);}
  .summary .lab{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-left:auto;font-size:.74rem;color:var(--muted);}
  .legend i{display:inline-block;width:11px;height:11px;margin-right:6px;vertical-align:-1px;}
  .k-av{background:var(--ok);} .k-out{background:var(--orange);}
  .h{font-family:var(--font);font-size:.68rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--teal-lt);margin:22px 0 12px;padding-left:9px;border-left:3px solid var(--teal);}
  .board{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;}
  .cam{background:rgba(0,0,0,.22);border:1px solid var(--line-soft);border-left:4px solid var(--ok);padding:13px 14px;}
  .cam.out{border-left-color:var(--orange);}
  .cam .n{font-family:var(--font);font-weight:600;letter-spacing:.03em;font-size:1rem;}
  .cam .s{font-size:.78rem;color:var(--muted);margin-top:3px;}
  .cam.out .s{color:#ffc7a6;}
  /* month calendar */
  .calhead{display:flex;align-items:center;gap:12px;margin:24px 0 10px;}
  .mtitle{font-family:var(--font);font-weight:600;text-transform:uppercase;letter-spacing:.1em;font-size:1rem;color:#fff;}
  .navb{font-family:var(--font);font-size:.9rem;color:#eafeff;background:rgba(0,184,184,.14);border:1px solid var(--line);cursor:pointer;padding:6px 12px;}
  .navb:hover{background:rgba(0,184,184,.28);}
  .dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;}
  .dow div{font-family:var(--font);font-size:.6rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);text-align:center;}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cell{min-height:92px;background:rgba(0,0,0,.22);border:1px solid var(--line-soft);padding:5px;display:flex;flex-direction:column;gap:4px;}
  .cell.out-month{opacity:.32;} .cell.today{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal);}
  .daynum{font-family:var(--font);font-size:.72rem;color:var(--muted);}
  .cell.today .daynum{color:var(--teal-lt);font-weight:700;}
  .pill{font-size:.68rem;line-height:1.25;padding:4px 6px;border-left:3px solid var(--teal);background:rgba(0,184,184,.14);color:#eafeff;}
  .pill .cam{font-weight:700;display:block;background:none;border:0;padding:0;}
  .pill .meta{color:var(--muted);font-size:.62rem;}
  .pill.overdue{border-left-color:var(--orange);background:rgba(255,107,26,.14);}
  .pill.returned{border-left-color:var(--grayed);background:rgba(160,180,180,.10);color:var(--faint);text-decoration:line-through;}
  .pill.reserved{border-left-color:#f5b301;background:rgba(245,179,1,.14);color:#ffe1a3;}
  .k-res{background:#f5b301;}
  .cam.reserved{border-left-color:#f5b301;} .cam.reserved .s{color:#ffd889;}
  .foot{margin-top:22px;font-size:.74rem;color:var(--faint);}
  body.embed .top, body.embed .sub{display:none;}
  body.embed .wrap{padding-top:16px;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <img src="https://www.creativesilva.com/assets/PV%20LOGO%20NEW.png" alt="Pioneer Valley High School" />
      <h1>Camera Checkout Calendar</h1>
      <a class="checkout-btn" href="/camera-checkout.html">Check out a camera</a>
    </div>
    <p class="sub">See which cameras are out and when they are due back before you ask. Updates automatically.</p>

    <div class="summary">
      <div><span class="big" id="outn">0</span> <span class="lab">of <span id="totn">0</span> cameras available</span></div>
      <div class="legend"><span><i class="k-av"></i>Available</span><span><i class="k-res"></i>Reserved</span><span><i class="k-out"></i>Checked out</span></div>
    </div>

    <div class="h">Cameras right now</div>
    <div class="board" id="board"><span class="foot">Loading&#8230;</span></div>

    <div class="calhead">
      <button class="navb" id="prev">&#8249;</button>
      <span class="mtitle" id="mtitle"></span>
      <button class="navb" id="next">&#8250;</button>
    </div>
    <div class="dow"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div>
    <div class="grid" id="grid"></div>

    <p class="foot" id="foot"></p>
  </div>

<script>
(function(){
  var API='https://pvhs-canvas-grader.onrender.com';
  if(/[?&]embed=1/.test(location.search)) document.body.classList.add('embed');
  var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var view=new Date(); view.setDate(1);
  var DATA={cameras:[],checkouts:[]};
  var grid=document.getElementById('grid'), mtitle=document.getElementById('mtitle'),
      board=document.getElementById('board'), outn=document.getElementById('outn'), totn=document.getElementById('totn'),
      foot=document.getElementById('foot');
  function todayISO(){ var d=new Date(); d.setHours(0,0,0,0); return d.toISOString().slice(0,10); }
  function fmt(iso){ if(!iso)return''; var p=iso.split('-'); return MONTHS[+p[1]-1].slice(0,3)+' '+(+p[2]); }
  function statusOf(c){ return c.status||(c.returned?'returned':'out'); }
  // A camera is unavailable while it is reserved OR picked up; returned frees it.
  function activeByCam(){ var m={}; DATA.checkouts.forEach(function(c){ if(statusOf(c)!=='returned') m[c.camera]=c; }); return m; }

  function renderBoard(){
    var active=activeByCam(); var cams=DATA.cameras||[];
    var avail=cams.filter(function(c){ return !active[c]; }).length;
    outn.textContent=avail; totn.textContent=cams.length;
    board.innerHTML='';
    if(!cams.length){ board.innerHTML='<span class="foot">No cameras configured yet.</span>'; return; }
    cams.forEach(function(c){
      var o=active[c]; var st=o?statusOf(o):'available';
      var el=document.createElement('div');
      el.className='cam'+(st==='reserved'?' reserved':(st!=='available'?' out':''));
      var sub = st==='available' ? 'Available'
              : st==='reserved' ? 'Reserved'
              : ('Checked out &middot; due '+fmt(o.due));
      el.innerHTML='<div class="n">'+c+'</div><div class="s">'+sub+'</div>';
      board.appendChild(el);
    });
  }
  function renderCal(){
    mtitle.textContent=MONTHS[view.getMonth()]+' '+view.getFullYear();
    var first=new Date(view.getFullYear(),view.getMonth(),1);
    var start=new Date(first); start.setDate(1-first.getDay());
    grid.innerHTML='';
    for(var i=0;i<42;i++){ var d=new Date(start); d.setDate(start.getDate()+i); var iso=d.toISOString().slice(0,10);
      var cell=document.createElement('div'); cell.className='cell'+(d.getMonth()!==view.getMonth()?' out-month':'')+(iso===todayISO()?' today':'');
      var dn=document.createElement('div'); dn.className='daynum'; dn.textContent=d.getDate(); cell.appendChild(dn);
      DATA.checkouts.filter(function(c){ return c.out===iso; }).forEach(function(c){
        var s=statusOf(c);
        var overdue=s==='out' && c.due < todayISO();
        var cls=s==='returned'?' returned':(s==='reserved'?' reserved':(overdue?' overdue':''));
        var meta=s==='returned'?'returned':(s==='reserved'?'reserved':(overdue?('overdue '+fmt(c.due)):('due '+fmt(c.due))));
        var pill=document.createElement('div'); pill.className='pill'+cls;
        pill.innerHTML='<span class="cam">'+c.camera+'</span><span class="meta">'+meta+'</span>';
        cell.appendChild(pill);
      });
      grid.appendChild(cell);
    }
  }
  function load(){
    fetch(API+'/api/camera/calendar',{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
      DATA={cameras:d.cameras||[],checkouts:d.checkouts||[]};
      renderBoard(); renderCal();
      foot.textContent='Updated '+new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})+'. Refreshes automatically.';
    }).catch(function(){ foot.textContent='Could not load the calendar. It will keep trying.'; });
  }
  document.getElementById('prev').addEventListener('click',function(){ view.setMonth(view.getMonth()-1); renderCal(); });
  document.getElementById('next').addEventListener('click',function(){ view.setMonth(view.getMonth()+1); renderCal(); });
  load(); setInterval(load,60000);
})();
</script>
</body>
</html>
