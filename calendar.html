<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Camera Checkouts | Chris Silva</title>
<meta name="description" content="Camera checkout calendar for Pioneer Valley photography." />
<meta name="robots" content="noindex" />
<link rel="icon" href="/logos/CS_Logo_Only_Teal.svg" />
<style>:root { --course-accent: #007474; }</style>
<link rel="stylesheet" href="/css/silva-module.css" />
<style>
  /* Teacher-facing calendar. Uses the shared unified header (built by silva-nav.js);
     the body is a title, the embedded Google Calendar, then the scannable QR below it. */
  .cal-title {
    font-family: 'Oswald', Arial, sans-serif; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.03em; font-size: clamp(1.6rem, 3.4vw, 2.5rem); line-height: 1.05;
    color: #ffffff; text-align: center; margin: 4px 0 14px;
  }
  .cal-title-rule { width: 80px; height: 3px; background: #00b8b8; margin: 0 auto 24px; }
  .cal-frame { background: linear-gradient(135deg, #00b8b8 0%, rgba(0, 184, 184, 0.10) 100%); padding: 2px; }
  .cal-frame iframe { display: block; width: 100%; height: 760px; border: 0; background: #ffffff; }
  /* QR, moved below the calendar, doubled in size, centered. */
  .cal-qr-wrap { display: flex; justify-content: center; margin: 30px 0 12px; }
  .cal-qr { display: inline-flex; align-items: center; gap: 22px; background: rgba(0, 184, 184, 0.06); border: 1px solid rgba(0, 184, 184, 0.28); border-left: 4px solid #00b8b8; padding: 18px 26px 18px 20px; }
  .cal-qr-tile { background: #ffffff; padding: 12px; border: 2px solid #00b8b8; flex: 0 0 auto; }
  .cal-qr-tile img { display: block; width: 208px; height: 208px; }
  .cal-qr-label { font-family: 'Oswald', Arial, sans-serif; font-size: 1rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #7fe9e9; line-height: 1.5; }
  @media (max-width: 640px) {
    .cal-frame iframe { height: 560px; }
    .cal-qr { flex-direction: column; gap: 14px; text-align: center; }
    .cal-qr-tile img { width: 176px; height: 176px; }
  }
</style>
</head>
<body>
<nav class="silva-nav" aria-label="Site navigation"></nav>
<div class="silva-page">
  <h1 class="cal-title">Camera Check Out Tracker</h1>
  <div class="cal-title-rule"></div>
  <div class="cal-frame">
    <iframe title="Camera Checkouts calendar" src="https://calendar.google.com/calendar/embed?src=c_0aa19ce0d075f9150d5610114ee936928de02b4082b0f2cbadd81c2a38d32aaf%40group.calendar.google.com&ctz=America%2FLos_Angeles&mode=MONTH&showTitle=0&showPrint=0&showTz=0&showCalendars=0" loading="lazy" scrolling="no"></iframe>
  </div>
  <div class="cal-qr-wrap">
    <div class="cal-qr">
      <div class="cal-qr-tile"><img src="/assets/camera-checkout-qr-v1.png" alt="QR code to open the camera checkout" /></div>
      <div class="cal-qr-label">Scan to<br>check out</div>
    </div>
  </div>
</div>
<script src="/js/silva-nav.js"></script>
</body>
</html>
