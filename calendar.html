<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Camera Checkout Calendar | Pioneer Valley Photography</title>
<meta name="description" content="See which Pioneer Valley photography cameras are checked out and when they are due back." />
<link rel="icon" type="image/svg+xml" href="/logos/CS_Logo_Only_Teal.svg" />
<link rel="apple-touch-icon" href="/logos/CS_AppIcon_Teal_180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/silva-module.css?v=d132cef2" />
<style>
  /* Camera calendar: shares the unified header (silva-nav.js) + the catalog CS-logo
     watermark background, so it matches curriculum.html. Body content below is
     calendar-specific and uses .silva-* -free class names (no collisions). */
  :root{
    --teal:#00b8b8; --teal-lt:#5ff0f0; --teal-deep:#007474;
    --text:#eafeff; --muted:rgba(206,244,244,0.66); --faint:rgba(206,244,244,0.42);
    --line:rgba(0,184,184,0.32); --line-soft:rgba(0,184,184,0.18);
    --ok:#3fa863; --orange:#ff6b1a; --grayed:rgba(160,180,180,0.34);
    --panel:linear-gradient(135deg,rgba(0,184,184,0.10) 0%,rgba(4,20,19,0.55) 100%);
    --font:'Oswald',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    --body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;border-radius:0 !important;}
  html,body{margin:0;padding:0;}
  body{background-color:#060f0f;color:var(--text);font-family:var(--body);min-height:100vh;line-height:1.5;}
  /* Same watermark treatment as curriculum.html: glossy CS logo on near-black under one flat veil. */
  body::before{content:"";position:fixed;inset:0;z-index:-2;background:#060f0f url("https://www.creativesilva.com/logos/CS_Logo_Glossy_Teal_v1.png") no-repeat center 40%;background-size:min(74vw,700px);}
  body::after{content:"";position:fixed;inset:0;z-index:-1;background:rgba(6,14,14,0.84);}
  @media (max-width:900px){ body::before{background-size:min(88vw,460px);background-position:center 36%;} }

  /* camera-kit icon injected into the shared header title */
  .cal-title-icon{height:1.02em;width:auto;margin-right:.42em;vertical-align:-0.16em;}

  .wrap{max-width:1200px;margin:0 auto;padding:24px 32px 70px;}
  .intro{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px;}
  .sub{color:var(--muted);font-size:.95rem;margin:0;flex:1 1 320px;}
  .reserve-btn{flex:0 0 auto;font-family:var(--font);font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#04110f;background:var(--teal);border:1px solid var(--teal);padding:11px 20px;cursor:pointer;text-decoration:none;transition:filter .15s;}
  .reserve-btn:hover{filter:brightness(1.12);}
  .summary{display:flex;align-items:center;gap:14px 22px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--teal);padding:14px 18px;margin-bottom:18px;}
  .summary .big{font-family:var(--font);font-size:1.6rem;color:var(--teal-lt);}
  .summary .lab{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-left:auto;font-size:.74rem;color:var(--muted);}
  .legend i{display:inline-block;width:11px;height:11px;margin-right:6px;vertical-align:-1px;}
  .k-res{background:#f5b301;} .k-out{background:var(--orange);}
  .h{font-family:var(--font);font-size:.68rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--teal-lt);margin:22px 0 12px;padding-left:9px;border-left:3px solid var(--teal);}
  .board{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;}
  .cam{background:rgba(0,0,0,.24);border:1px solid var(--line-soft);border-left:4px solid var(--orange);padding:13px 14px;}
  .cam.reserved{border-left-color:#f5b301;}
  .cam .n{font-family:var(--font);font-weight:600;letter-spacing:.03em;font-size:1rem;}
  .cam .s{font-size:.78rem;color:#ffc7a6;margin-top:3px;}
  .cam.reserved .s{color:#ffd889;}
  .cam .course{font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-top:5px;}
  /* month calendar */
  .calhead{display:flex;align-items:center;gap:12px;margin:26px 0 10px;}
  .mtitle{font-family:var(--font);font-weight:600;text-transform:uppercase;letter-spacing:.1em;font-size:1rem;color:#fff;}
  .navb{font-family:var(--font);font-size:.9rem;color:#eafeff;background:rgba(0,184,184,.14);border:1px solid var(--line);cursor:pointer;padding:6px 12px;}
  .navb:hover{background:rgba(0,184,184,.28);}
  .dow{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px;}
  .dow div{font-family:var(--font);font-size:.6rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);text-align:left;padding-left:6px;}
  /* Google-style month: each week is a band; camera checkouts are bars spanning their days. */
  .grid{display:flex;flex-direction:column;}
  .week{position:relative;}
  .wdays{display:grid;grid-template-columns:repeat(7,1fr);}
  .wcell{min-height:calc(24px + var(--lanes,0) * 20px + 6px);background:rgba(0,0,0,.24);border:1px solid var(--line-soft);border-top:0;border-left:0;padding:3px 6px;cursor:pointer;}
  .wcell:first-child{border-left:1px solid var(--line-soft);}
  .week:first-child .wcell{border-top:1px solid var(--line-soft);}
  .wcell.out-month{opacity:.4;} .wcell.today{box-shadow:inset 0 0 0 2px var(--teal);}
  .wcell:hover{background:rgba(0,184,184,.12);}
  .wdaynum{font-family:var(--font);font-size:.72rem;color:var(--muted);}
  .wcell.today .wdaynum{color:var(--teal-lt);font-weight:700;}
  .wmore{font-family:var(--font);font-size:.6rem;color:var(--faint);margin-top:2px;}
  .wbars{position:absolute;top:23px;left:0;right:0;pointer-events:none;}
  .wbar{position:absolute;height:17px;line-height:17px;font-family:var(--font);font-weight:600;font-size:.62rem;letter-spacing:.02em;color:#04110f;padding:0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:auto;cursor:pointer;box-sizing:border-box;box-shadow:0 0 0 1px rgba(4,17,15,.25);}
  .wbar.out{background:var(--orange);} .wbar.res{background:#f5b301;} .wbar.od{background:#e0403a;color:#fff;}
  .wbar.contL{margin-left:-1px;} .wbar.contR{}
  /* day pop-out: fixed size (fits all 18) so it never resizes between tabs */
  .daymodal{position:fixed;inset:0;background:rgba(2,12,12,.66);backdrop-filter:blur(8px) saturate(1.1);-webkit-backdrop-filter:blur(8px) saturate(1.1);display:none;align-items:center;justify-content:center;padding:20px;z-index:60;}
  .daymodal.open{display:flex;}
  .dm-panel{background:linear-gradient(135deg,rgba(0,184,184,.10),rgba(4,20,19,.97));border:1px solid var(--line);border-top:3px solid var(--teal);width:100%;max-width:480px;height:min(880px,86vh);display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.6);}
  .dm-head{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line-soft);}
  .dm-title{font-family:var(--font);font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#fff;font-size:.98rem;}
  .dm-x{background:none;border:0;color:var(--muted);font-size:1.7rem;line-height:1;cursor:pointer;padding:0 4px;}
  .dm-x:hover{color:#fff;}
  .dm-tabs{flex:0 0 auto;display:flex;gap:4px;padding:0 12px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap;}
  .dm-tab{font-family:var(--font);font-size:.66rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:none;border:0;border-bottom:2px solid transparent;padding:11px 12px;cursor:pointer;}
  .dm-tab:hover{color:var(--text);}
  .dm-tab.active{color:var(--teal-lt);border-bottom-color:var(--teal);}
  .dm-tabn{font-size:.62rem;color:var(--faint);}
  .dm-tab.active .dm-tabn{color:var(--teal-lt);}
  .dm-body{flex:1 1 auto;overflow-y:auto;padding:8px 18px 18px;}
  .dm-row{display:flex;align-items:baseline;gap:10px;padding:9px 0;border-bottom:1px solid rgba(0,184,184,.12);}
  .dm-cam{font-family:var(--font);font-weight:700;min-width:60px;color:#fff;}
  .dm-range{color:var(--muted);font-size:.84rem;flex:1;}
  .dm-course{font-size:.58rem;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);white-space:nowrap;}
  .dm-tag{font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;padding:2px 7px;white-space:nowrap;}
  .dm-tag.res{background:rgba(245,179,1,.16);color:#ffd889;} .dm-tag.od{background:rgba(255,107,26,.18);color:#ffb28a;}
  .dm-empty{color:var(--faint);padding:8px 0;}
  .dm-avail{display:flex;flex-wrap:wrap;gap:8px;}
  .dm-availcam{font-family:var(--font);font-weight:700;font-size:.82rem;color:#8ff0b0;background:rgba(63,168,99,.13);border-left:3px solid var(--ok);padding:8px 11px;}
  .dm-availcam small{display:block;font-weight:400;font-size:.56rem;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-top:2px;}
  .foot{margin-top:22px;font-size:.74rem;color:var(--faint);}
  body.embed .silva-nav, body.embed .intro{display:none;}
  body.embed .wrap{padding-top:16px;}
</style>
</head>
<body>
<nav class="silva-nav" aria-label="Site navigation"></nav>
<div class="wrap">
  <div class="intro">
    <p class="sub">See which cameras are out and when they are due back before you ask. Cam 16, 17 and 18 are Photography 2 only. Updates automatically.</p>
    <a class="reserve-btn" href="/camera-checkout.html">Reserve a camera</a>
  </div>

  <div class="summary">
    <div><span class="big" id="outn">0</span> <span class="lab">of <span id="totn">0</span> cameras available</span></div>
    <div class="legend"><span><i class="k-res"></i>Reserved</span><span><i class="k-out"></i>Checked out</span></div>
  </div>

  <div class="h">Checked out right now</div>
  <div class="board" id="board"><span class="foot">Loading&#8230;</span></div>

  <div class="calhead">
    <button class="navb" id="prev">&#8249;</button>
    <span class="mtitle" id="mtitle"></span>
    <button class="navb" id="next">&#8250;</button>
  </div>
  <div class="dow"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div>
  <div class="grid" id="grid"></div>

  <p class="foot" id="foot"></p>
</div>

<div class="daymodal" id="daymodal">
  <div class="dm-panel">
    <div class="dm-head"><span class="dm-title" id="dm-title"></span><button class="dm-x" id="dm-x" aria-label="Close">&times;</button></div>
    <div class="dm-tabs" id="dm-tabs"></div>
    <div class="dm-body" id="dm-body"></div>
  </div>
</div>

<script src="/js/silva-nav.js?v=97b66897"></script>
<script>
(function(){
  var API='https://command.creativesilva.com';
  if(/[?&]embed=1/.test(location.search)) document.body.classList.add('embed');
  var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var view=new Date(); view.setDate(1);
  var DATA={cameras:[],checkouts:[]};
  var grid=document.getElementById('grid'), mtitle=document.getElementById('mtitle'),
      board=document.getElementById('board'), outn=document.getElementById('outn'), totn=document.getElementById('totn'),
      foot=document.getElementById('foot');

  // Inject the camera-kit icon into the shared header title once silva-nav.js has built it.
  function injectIcon(){
    var t=document.querySelector('.silva-uni-title');
    if(!t) return false;
    if(t.querySelector('.cal-title-icon')) return true;
    var txt=t.textContent;
    t.innerHTML='<img class="cal-title-icon" src="/assets/Icons/assignment/camera-kit-teal-v1.svg" alt="" />'+txt;
    return true;
  }
  function tryInject(n){ if(injectIcon()||n<=0) return; setTimeout(function(){ tryInject(n-1); },40); }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){ tryInject(60); }); else tryInject(60);

  function todayISO(){ var d=new Date(); d.setHours(0,0,0,0); return d.toISOString().slice(0,10); }
  function fmt(iso){ if(!iso)return''; var p=iso.split('-'); return MONTHS[+p[1]-1].slice(0,3)+' '+(+p[2]); }
  function statusOf(c){ return c.status||(c.returned?'returned':'out'); }
  // Cam 16/17/18 are Photography 2 only; the rest serve Photo 1 and Photo 2.
  function camCourse(cam){ var n=parseInt((cam||'').replace(/\D/g,''),10); return (n>=16)?'Photo 2 only':'Photo 1 &amp; 2'; }
  // A camera is unavailable while it is reserved OR picked up; returned frees it.
  function activeByCam(){ var m={}; DATA.checkouts.forEach(function(c){ if(statusOf(c)!=='returned') m[c.camera]=c; }); return m; }

  function renderBoard(){
    var active=activeByCam(); var cams=DATA.cameras||[];
    var outCams=cams.filter(function(c){ return active[c]; });
    outn.textContent=(cams.length-outCams.length); totn.textContent=cams.length;
    board.innerHTML='';
    if(!cams.length){ board.innerHTML='<span class="foot">No cameras set up yet.</span>'; return; }
    if(!outCams.length){ board.innerHTML='<span class="foot">All cameras are available right now.</span>'; return; }
    outCams.forEach(function(c){
      var o=active[c]; var st=statusOf(o);
      var el=document.createElement('div');
      el.className='cam'+(st==='reserved'?' reserved':'');
      el.innerHTML='<div class="n">'+c+'</div><div class="s">'+(st==='reserved'?'Reserved':('Checked out &middot; due '+fmt(o.due)))+'</div><div class="course">'+camCourse(c)+'</div>';
      board.appendChild(el);
    });
  }

  function el(t,c,x){ var e=document.createElement(t); if(c) e.className=c; if(x!=null) e.textContent=x; return e; }
  function isoD(d){ var x=new Date(d.getTime?d.getTime():d); x.setHours(12,0,0,0); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); }
  function addDays(iso,n){ var p=iso.split('-'); var d=new Date(+p[0],+p[1]-1,+p[2],12,0,0); d.setDate(d.getDate()+n); return isoD(d); }
  function dayDiff(a,b){ var pa=a.split('-'),pb=b.split('-'); return Math.round((new Date(+pb[0],+pb[1]-1,+pb[2])-new Date(+pa[0],+pa[1]-1,+pa[2]))/86400000); }
  // Last day a camera is OUT. The due date is the return day (not an out-day). A picked-up
  // camera that is not returned keeps rolling forward to today until it is toggled returned.
  function effLast(c){
    var st=statusOf(c); if(st==='returned') return null;
    var start=c.out; if(!start) return null;
    var last=addDays(c.due||start,-1); if(last<start) last=start;
    if(st==='out' && todayISO()>last) last=todayISO();
    return last;
  }
  function checkoutsOnDay(iso){
    return (DATA.checkouts||[]).filter(function(c){ var last=effLast(c); return last && c.out && iso>=c.out && iso<=last; });
  }
  function prettyDate(iso){ var p=iso.split('-'); var d=new Date(+p[0],+p[1]-1,+p[2]);
    var days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    return days[d.getDay()]+', '+MONTHS[+p[1]-1]+' '+(+p[2]); }
  // Google-style month: each week is a band; each active checkout is a bar spanning its out->return days.
  function renderCal(){
    mtitle.textContent=MONTHS[view.getMonth()]+' '+view.getFullYear();
    var first=new Date(view.getFullYear(),view.getMonth(),1);
    var startD=new Date(first); startD.setDate(1-first.getDay());
    var startISO=isoD(startD), curMonth=view.getMonth();
    var events=[];
    (DATA.checkouts||[]).forEach(function(c){ var last=effLast(c); if(!last||!c.out) return;
      events.push({camera:c.camera, start:c.out, last:last, status:statusOf(c),
        overdue:(statusOf(c)==='out' && c.due && c.due<=todayISO())}); });
    grid.innerHTML='';
    var MAXLANE=18;   // show every checked-out camera (up to the full inventory), not a small cap
    for(var w=0; w<6; w++){
      var wkStartISO=addDays(startISO, w*7), wkEndISO=addDays(wkStartISO,6);
      var wev=events.filter(function(e){ return e.start<=wkEndISO && e.last>=wkStartISO; });
      wev.sort(function(a,b){ return a.start<b.start?-1:a.start>b.start?1:(a.camera||'').localeCompare(b.camera||''); });
      var laneEnd=[];
      wev.forEach(function(e){
        e._sc=Math.max(0, dayDiff(wkStartISO, e.start));
        e._ec=Math.min(6, dayDiff(wkStartISO, e.last));
        var ln=0; while(laneEnd[ln]!==undefined && laneEnd[ln]>=e._sc) ln++;
        laneEnd[ln]=e._ec; e._lane=ln;
      });
      var week=el('div','week'); week.style.setProperty('--lanes', Math.min(laneEnd.length, MAXLANE));
      var days=el('div','wdays');
      for(var d=0; d<7; d++){
        var diso=addDays(wkStartISO,d), dp=diso.split('-');
        var cell=el('div','wcell'+(((+dp[1]-1)===curMonth)?'':' out-month')+(diso===todayISO()?' today':''));
        cell.appendChild(el('div','wdaynum', String(+dp[2])));
        var dayN=wev.filter(function(e){ return e._sc<=d && e._ec>=d; }).length;
        if(dayN>MAXLANE) cell.appendChild(el('div','wmore','+'+(dayN-MAXLANE)+' more'));
        (function(day){ cell.addEventListener('click',function(){ openDayModal(day); }); })(diso);
        days.appendChild(cell);
      }
      week.appendChild(days);
      var bars=el('div','wbars');
      wev.forEach(function(e){
        if(e._lane>=MAXLANE) return;
        var cls='wbar '+(e.status==='reserved'?'res':(e.overdue?'od':'out'));
        if(e.start<wkStartISO) cls+=' contL'; if(e.last>wkEndISO) cls+=' contR';
        var bar=el('div',cls, e.camera);
        bar.style.left='calc('+(e._sc/7*100)+'% + 2px)';
        bar.style.width='calc('+((e._ec-e._sc+1)/7*100)+'% - 4px)';
        bar.style.top=(e._lane*20)+'px';
        (function(day){ bar.addEventListener('click',function(ev){ ev.stopPropagation(); openDayModal(day); }); })(e.start>wkStartISO?e.start:wkStartISO);
        bars.appendChild(bar);
      });
      week.appendChild(bars);
      grid.appendChild(week);
    }
  }

  // ---- Day pop-out: fixed-size window with Checked out / Reserved / Available tabs ----
  var DM_DAY=null, DM_TAB='out';
  function byCam(a,b){ return (a.camera||'').localeCompare(b.camera||''); }
  function dayOut(iso){ return checkoutsOnDay(iso).filter(function(c){ return statusOf(c)==='out'; }).sort(byCam); }
  function dayReserved(iso){ return checkoutsOnDay(iso).filter(function(c){ return statusOf(c)==='reserved'; }).sort(byCam); }
  function dayAvailable(iso){ var busy={}; checkoutsOnDay(iso).forEach(function(c){ busy[c.camera]=1; }); return (DATA.cameras||[]).filter(function(c){ return !busy[c]; }); }
  function dmTab(t,label,n){ return '<button type="button" class="dm-tab'+(DM_TAB===t?' active':'')+'" data-tab="'+t+'">'+label+' <span class="dm-tabn">'+n+'</span></button>'; }
  function openDayModal(iso){ DM_DAY=iso; DM_TAB='out'; renderDayModal(); document.getElementById('daymodal').classList.add('open'); }
  function renderDayModal(){
    var iso=DM_DAY; if(!iso) return;
    var out=dayOut(iso), res=dayReserved(iso), avail=dayAvailable(iso);
    document.getElementById('dm-title').textContent=prettyDate(iso);
    document.getElementById('dm-tabs').innerHTML=dmTab('out','Checked out',out.length)+dmTab('reserved','Reserved',res.length)+dmTab('available','Available',avail.length);
    var body;
    if(DM_TAB==='reserved'){
      body=res.length?res.map(function(c){ return '<div class="dm-row"><span class="dm-cam">'+c.camera+'</span><span class="dm-range">Reserved '+fmt(c.out)+' &rarr; due '+fmt(c.due)+'</span><span class="dm-course">'+camCourse(c.camera)+'</span></div>'; }).join(''):'<div class="dm-empty">No reservations this day.</div>';
    } else if(DM_TAB==='available'){
      body=avail.length?'<div class="dm-avail">'+avail.map(function(c){ return '<span class="dm-availcam">'+c+'<small>'+camCourse(c)+'</small></span>'; }).join('')+'</div>':'<div class="dm-empty">No cameras free this day.</div>';
    } else {
      body=out.length?out.map(function(c){ var od=(c.due&&c.due<todayISO())?'<span class="dm-tag od">Overdue</span>':''; return '<div class="dm-row"><span class="dm-cam">'+c.camera+'</span><span class="dm-range">Picked up '+fmt(c.out)+' &rarr; due '+fmt(c.due)+'</span><span class="dm-course">'+camCourse(c.camera)+'</span>'+od+'</div>'; }).join(''):'<div class="dm-empty">No cameras checked out this day.</div>';
    }
    document.getElementById('dm-body').innerHTML=body;
    Array.prototype.forEach.call(document.querySelectorAll('#dm-tabs .dm-tab'), function(btn){
      btn.addEventListener('click', function(){ DM_TAB=btn.getAttribute('data-tab'); renderDayModal(); });
    });
  }
  function closeDayModal(){ document.getElementById('daymodal').classList.remove('open'); }

  function load(){
    fetch(API+'/api/camera/calendar',{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
      DATA={cameras:d.cameras||[],checkouts:d.checkouts||[]};
      renderBoard(); renderCal(); if(DM_DAY) renderDayModal();
      foot.textContent='Updated '+new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})+'. Refreshes automatically.';
    }).catch(function(){ foot.textContent='Could not load the calendar. It will keep trying.'; });
  }
  document.getElementById('prev').addEventListener('click',function(){ view.setMonth(view.getMonth()-1); renderCal(); });
  document.getElementById('next').addEventListener('click',function(){ view.setMonth(view.getMonth()+1); renderCal(); });
  document.getElementById('dm-x').addEventListener('click',closeDayModal);
  document.getElementById('daymodal').addEventListener('click',function(e){ if(e.target===this) closeDayModal(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeDayModal(); });
  load(); setInterval(load,60000);
})();
