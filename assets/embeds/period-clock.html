<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Period Clock</title>
<!--
  Compact rolling period countdown for the Curriculum Catalog header.
  Same approach as assets/embeds/schoolday-card.html: it loads schedule-data.js
  LIVE from the pvhs_tools app, so the schedule and the current period derive
  from the real calendar. The label, digits, and color coding mirror the
  pvhs_tools countdown (normal/caution/warning states). Clicking opens the
  full countdown in popout mode in a new tab.
-->
<style>
  :root {
    --white-gradient: linear-gradient(180deg, #ffffff 0%, #dceaea 100%);
    --orange-gradient: linear-gradient(180deg, #ffe1b5 0%, #ffac39 56%, #e06f00 100%);
    --red-gradient: linear-gradient(180deg, #ffb8b8 0%, #ff5b5b 58%, #b80000 100%);
    --green-gradient: linear-gradient(180deg, #d2ffcf 0%, #5bff61 58%, #00b806 100%);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; }
  body { font-family: 'Oswald', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  .clock {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100vh; padding: 2px; text-decoration: none; text-align: center;
  }
  .desc {
    font-size: 9.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    color: #5eead4; line-height: 1.1; white-space: nowrap; margin-bottom: 1px;
  }
  .digits {
    font-size: 30px; font-weight: 900; letter-spacing: -0.02em; line-height: 0.95;
    font-variant-numeric: tabular-nums; white-space: nowrap;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 4px 14px rgba(0, 0, 0, 0.28);
  }
  .digits.normal  { background-image: var(--white-gradient); }
  .digits.caution { background-image: var(--orange-gradient); }
  .digits.warning { background-image: var(--red-gradient); }
  .digits.rest    { background-image: var(--green-gradient); }
  .digits.empty   { font-size: 15px; font-weight: 700; letter-spacing: 0.06em; color: #9fe9e0; background: none; -webkit-text-fill-color: #9fe9e0; }
</style>
</head>
<body>
  <a class="clock" id="clockLink" href="https://creativesilva.github.io/pvhs_tools/countdown.html?mode=popout" target="_blank" rel="noopener" title="Pop out the countdown clock">
    <span class="desc" id="desc">Loading&hellip;</span>
    <span class="digits normal" id="digits">--:--</span>
  </a>

  <!-- Live calendar + bell-schedule data and helper functions from the pvhs_tools app. -->
  <script src="https://creativesilva.github.io/pvhs_tools/schedule-data.js"></script>
  <script>
    (function () {
      var descEl = document.getElementById('desc');
      var digEl  = document.getElementById('digits');

      function show(desc, digits, state) {
        descEl.textContent = desc;
        if (digits) { digEl.textContent = digits; digEl.className = 'digits ' + state; }
        else { digEl.textContent = ''; descEl && (descEl.style.marginBottom = '0'); }
      }
      function showMsg(desc, msg) { descEl.textContent = desc; digEl.textContent = msg; digEl.className = 'digits empty'; }

      function tick() {
        // If the live data failed to load, the helper functions are undefined.
        if (typeof getNow !== 'function' || typeof getScheduleBlocks !== 'function') {
          showMsg('Camera Checkout', 'Countdown'); return;
        }
        var now = getNow();
        var schoolDay = (typeof schoolDays !== 'undefined' && Array.isArray(schoolDays)) ? schoolDays.indexOf(now.dateStr) !== -1 : true;
        var blocks = getScheduleBlocks(now.dateStr);
        if (!schoolDay || !blocks || !blocks.length) { showMsg('Today', 'No School'); return; }

        var t = now.totalSec;
        var firstStart = parseToSec(blocks[0].s);
        var lastEnd = parseToSec(blocks[blocks.length - 1].e);

        if (t < firstStart) { show('School Starts ' + fmt12(blocks[0].s), formatTime(firstStart - t), 'normal'); return; }
        if (t >= lastEnd)  { showMsg('School Day Done', "See You Tomorrow"); return; }

        for (var i = 0; i < blocks.length; i++) {
          var s = parseToSec(blocks[i].s), e = parseToSec(blocks[i].e);
          if (t >= s && t < e) {
            var rem = e - t, elapsed = t - s;
            var isClass = isInstructionalPeriod(blocks[i].l);
            var isPass  = isPassingBlock(blocks[i].l);
            var isFirstTen = isClass && elapsed < 600;
            var isLastTen  = isClass && rem <= 600;
            var isLastFive = isClass && rem <= 300;
            var isLastFivePassing = isPass && rem <= 300;
            var state = 'normal';
            if (isLastFive || isLastFivePassing) state = 'warning';
            else if (isFirstTen || isLastTen) state = 'caution';
            // Drop "PERIOD" to save space: "4TH PERIOD" -> "4TH", so it reads "4TH ENDS 12:25".
            var lbl = blocks[i].l.replace(/\s*PERIOD\b/i, '');
            show(lbl + blockTimeSpan(blocks[i]), formatTime(rem), state);
            return;
          }
        }
        show('Passing', '', 'normal');
      }

      tick();
      setInterval(tick, 1000);

      // Click the clock: pop it out as a small floating window directly in popout mode.
      // If the popup is blocked, the anchor's target="_blank" opens it in a new tab instead.
      var link = document.getElementById('clockLink');
      if (link) {
        link.addEventListener('click', function (e) {
          var win = window.open(link.href, 'pvhsCountdown',
            'width=430,height=800,menubar=no,toolbar=no,location=no,status=no,resizable=yes,scrollbars=yes');
          if (win) { e.preventDefault(); try { win.focus(); } catch (_) {} }
        });
      }
    })();
  </script>
</body>
</html>
