<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PVHS School Day Countdown</title>
  <!--
    Standalone school-day countdown card, embedded via <iframe> on Canvas home pages.
    Single source of truth: it loads schedule-data.js LIVE from the pvhs_tools app,
    so the 180-day calendar stays in sync with that app automatically. Update the
    school year in one place (pvhs_tools/schedule-data.js) and this card follows.
  -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: transparent;
      font-family: Arial, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%; height: 100%;
      padding: 14px 16px 13px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: rgba(0, 6, 6, 0.58);
      border: 1px solid rgba(0, 116, 116, 0.30);
      border-left: 4px solid #007474;
      border-radius: 12px;
    }
    .num {
      font-size: clamp(30px, 22vw, 46px);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
      color: #5eead4;
      line-height: 1;
    }
    .label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.55);
      padding-top: 5px;
    }
    .bar-wrap {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.10);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 12px;
    }
    .bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #007474 0%, #5eead4 100%);
      border-radius: 3px;
      transition: width 0.6s ease;
    }
    .meta {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      width: 100%;
      margin-top: 6px;
    }
    .meta span {
      font-size: 8px;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.32);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="num" id="num">&ndash;</div>
    <div class="label">School Days Left</div>
    <div class="bar-wrap"><div class="bar-fill" id="bar"></div></div>
    <div class="meta">
      <span id="progress">Day &ndash; of &ndash;</span>
      <span id="last">Last Day: &ndash;</span>
    </div>
  </div>

  <!-- Live calendar data from the pvhs_tools app (defines global schoolDays[]) -->
  <script src="https://creativesilva.github.io/pvhs_tools/schedule-data.js"></script>
  <script>
    (function () {
      var numEl  = document.getElementById('num');
      var barEl  = document.getElementById('bar');
      var progEl = document.getElementById('progress');
      var lastEl = document.getElementById('last');

      // Guard: if the data file did not load, leave the placeholder dashes.
      if (typeof schoolDays === 'undefined' || !schoolDays.length) { return; }

      // Today's date in Pacific time as YYYY-MM-DD (matches schoolDays format).
      var todayStr = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'America/Los_Angeles',
        year: 'numeric', month: '2-digit', day: '2-digit'
      }).format(new Date());

      var total = schoolDays.length;                                  // 180
      var left  = schoolDays.filter(function (d) { return d >= todayStr; }).length;
      var done  = total - left;
      var pct   = total ? Math.round((done / total) * 100) : 0;

      numEl.textContent  = left;
      barEl.style.width  = pct + '%';
      progEl.textContent = 'Day ' + Math.min(done + (left > 0 ? 1 : 0), total) + ' of ' + total;

      var lastSD = schoolDays[schoolDays.length - 1];
      lastEl.textContent = 'Last Day: ' + new Intl.DateTimeFormat('en-US', {
        timeZone: 'America/Los_Angeles', month: 'short', day: 'numeric'
      }).format(new Date(lastSD + 'T12:00:00'));
    })();
  </script>
</body>
</html>
