<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PVHS School Days Countdown</title>
  <!--
    School-day countdown embedded via <iframe> on Canvas home pages.
    MAIN number  = total school days left in the year (today through the last day).
    SECONDARY    = school days until the next day off (holiday or long weekend),
                   with the break name and date.
    It loads schedule-data.js LIVE from the pvhs_tools app, so all dates derive
    from the real calendar. Holiday NAMES come from the map below; update it each
    school year alongside the pvhs_tools calendar.
  -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: transparent;
      font-family: Arial, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%; height: 100%;
      padding: 12px 16px 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      /* Angular nav-tile aesthetic: top-left teal triangle eyebrow over a dark body */
      background: linear-gradient(135deg, rgba(0,184,184,0.20) 0%, rgba(0,184,184,0.20) 8%, rgba(0,6,6,0.66) 8%, rgba(0,6,6,0.66) 100%);
      border: 2px solid transparent;
      border-image: linear-gradient(135deg, #00b8b8 0%, rgba(0,184,184,0.08) 100%) 1;
      overflow: hidden;
    }
    .num {
      font-size: clamp(28px, 20vw, 44px);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
      color: #5eead4;
      line-height: 1;
    }
    .label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.55);
      padding-top: 4px;
    }
    .bar-wrap {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.10);
      overflow: hidden;
      margin-top: 10px;
    }
    .bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #007474 0%, #5eead4 100%);
      transition: width 0.6s ease;
    }
    .next { width: 100%; margin-top: 9px; }
    .next-line {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.58);
    }
    .next-line b { color: #5eead4; font-size: 11px; }
    .next-sub {
      font-size: 8.5px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.42);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="num" id="num">&ndash;</div>
    <div class="label">School Days Left</div>
    <div class="bar-wrap"><div class="bar-fill" id="bar"></div></div>
    <div class="next">
      <div class="next-line"><b id="to-break">&ndash;</b> <span id="to-break-label">school days to next break</span></div>
      <div class="next-sub"><span id="off-name">&ndash;</span> &middot; <span id="off-date">&ndash;</span></div>
    </div>
  </div>

  <!-- Live calendar data from the pvhs_tools app (defines global schoolDays[]) -->
  <script src="https://creativesilva.github.io/pvhs_tools/schedule-data.js"></script>
  <script>
    (function () {
      var numEl   = document.getElementById('num');
      var barEl   = document.getElementById('bar');
      var breakEl = document.getElementById('to-break');
      var breakLb = document.getElementById('to-break-label');
      var nameEl  = document.getElementById('off-name');
      var dateEl  = document.getElementById('off-date');

      if (typeof schoolDays === 'undefined' || !schoolDays.length) { return; }

      // Named holidays / breaks for the 2026-27 year. Key = first weekday off.
      // Update this map each school year to match the pvhs_tools calendar.
      var HOLIDAY_NAMES = {
        '2026-09-07': 'Labor Day',
        '2026-11-11': 'Veterans Day',
        '2026-11-23': 'Thanksgiving Break',
        '2026-12-21': 'Winter Break',
        '2027-01-18': 'MLK Day',
        '2027-02-15': 'Presidents Day',
        '2027-05-25': 'Memorial Day'
      };

      var set = {};
      for (var i = 0; i < schoolDays.length; i++) { set[schoolDays[i]] = true; }
      var first = schoolDays[0];
      var last  = schoolDays[schoolDays.length - 1];

      var today = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'America/Los_Angeles', year: 'numeric', month: '2-digit', day: '2-digit'
      }).format(new Date());

      function shift(ds, n) {
        var d = new Date(ds + 'T12:00:00');
        d.setDate(d.getDate() + n);
        var y = d.getFullYear(), m = ('0' + (d.getMonth() + 1)).slice(-2), day = ('0' + d.getDate()).slice(-2);
        return y + '-' + m + '-' + day;
      }
      function weekday(ds) { return new Date(ds + 'T12:00:00').getDay(); } // 0 Sun .. 6 Sat

      var start = today < first ? first : today;

      // MAIN: total school days left in the year (today through the last day).
      var total    = schoolDays.length;
      var daysLeft = schoolDays.filter(function (d) { return d >= today; }).length;
      var pct = total ? Math.max(0, Math.min(100, Math.round((total - daysLeft) / total * 100))) : 0;

      // Next day off = next weekday (Mon-Fri) with no school, on or before the last day.
      var nextOff = null, c = start;
      for (var k = 0; k < 400; k++) {
        c = shift(c, 1);
        if (c > last) break;
        var wd = weekday(c);
        if (wd === 0 || wd === 6) continue;
        if (!set[c]) { nextOff = c; break; }
      }

      // SECONDARY: school days from today until that next day off.
      var boundary = nextOff || shift(last, 1); // no more holidays: count to end of year
      var toBreak  = schoolDays.filter(function (d) { return d >= today && d < boundary; }).length;

      // Name the day off.
      var name;
      if (!nextOff) {
        name = 'Summer Break';
      } else if (HOLIDAY_NAMES[nextOff]) {
        name = HOLIDAY_NAMES[nextOff];
      } else {
        var dayAfter = shift(nextOff, 1);
        var multi = weekday(dayAfter) !== 0 && weekday(dayAfter) !== 6 && !set[dayAfter];
        name = multi ? 'Break' : 'Day Off';
      }

      var dateStr = new Intl.DateTimeFormat('en-US', {
        timeZone: 'America/Los_Angeles', weekday: 'short', month: 'short', day: 'numeric'
      }).format(new Date(boundary + 'T12:00:00'));

      numEl.textContent   = daysLeft;
      barEl.style.width   = pct + '%';
      breakEl.textContent = toBreak;
      breakLb.textContent = (toBreak === 1 ? 'school day to next break' : 'school days to next break');
      nameEl.textContent  = name;
      dateEl.textContent  = dateStr;
    })();
  </script>
</body>
</html>
