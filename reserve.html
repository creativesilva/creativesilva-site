<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Equipment Rental | Pioneer Valley</title>
<meta name="description" content="Reserve cameras and photography equipment at Pioneer Valley High School." />
<link rel="icon" href="/assets/PV_Square_Logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/store.css?v=1" />
</head>
<body>

<header class="store-nav">
  <div class="wrap">
    <a class="store-logo" href="/reserve.html" aria-label="Pioneer Valley"><img src="/assets/PV_Square_Logo.png" alt="Pioneer Valley" /></a>
    <div class="store-brand"><b>Pioneer Valley</b><span>Equipment Rental</span></div>
    <div class="nav-right">
      <button type="button" class="acct-btn" id="acctBtn">My Account</button>
      <button type="button" class="cart-btn" id="cartBtn">Cart <span class="cart-n empty" id="cartN">0</span></button>
    </div>
  </div>
</header>

<section class="store-hero" id="hero">
  <div class="wrap">
    <div class="hero-eyebrow" id="heroEyebrow">Pioneer Valley Photography</div>
    <h1 class="hero-title"><span class="dim">reserve your</span><br>GEAR.</h1>
    <p class="hero-sub">Browse the kit, add what you need, pick your day and pickup time. Sign in with your student number to start.</p>
  </div>
</section>

<main class="wrap">
  <section class="cats">
    <div class="section-head"><span class="bar"></span>Reserve Equipment</div>
    <div class="tiles" id="cats">
      <button type="button" class="tile" data-cat="cameras">
        <span class="tnum">01</span>
        <h3>Camera Kits</h3>
        <span class="tsub">R50 &middot; RP &middot; R8 &rarr;</span>
      </button>
      <button type="button" class="tile" data-cat="tripods">
        <span class="tnum">02</span>
        <h3>Tripods</h3>
        <span class="tsub">K&amp;F Concept &rarr;</span>
      </button>
      <button type="button" class="tile" data-cat="lighting">
        <span class="tnum">03</span>
        <h3>Lighting</h3>
        <span class="tsub">Speedlite &middot; Godox &rarr;</span>
      </button>
      <button type="button" class="tile accent" data-cat="accessories">
        <span class="tnum">04</span>
        <h3>Accessories</h3>
        <span class="tsub">Lenses &middot; remotes &middot; more &rarr;</span>
      </button>
    </div>
  </section>
</main>

<!-- Sign-in dialog: student number only, no password. -->
<div class="sov" id="signinOv" aria-hidden="true">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="signinTitle">
    <div class="sheet-bd">
      <h2 id="signinTitle">My Account</h2>
      <p>Sign in with your student number to reserve equipment.</p>
      <div class="field">
        <label for="sid">Student number</label>
        <input type="text" id="sid" inputmode="numeric" autocomplete="off" placeholder="e.g. 123456" />
      </div>
      <div class="sheet-msg" id="signinMsg"></div>
      <button type="button" class="btn block" id="signinGo">Sign in</button>
    </div>
  </div>
</div>

<script>
(function(){
  // Teacher scope from the link (?teacher=silva|garcia|mankin); drives which inventory shows.
  var TEACHER=(new URLSearchParams(location.search).get('teacher')||'silva').toLowerCase();
  var SIGNED_IN=false; try{ SIGNED_IN=!!sessionStorage.getItem('pv_sid'); }catch(e){}

  var ov=document.getElementById('signinOv');
  function openSignin(){ ov.classList.add('open'); ov.setAttribute('aria-hidden','false'); var i=document.getElementById('sid'); if(i){ try{ i.focus(); }catch(e){} } }
  function closeSignin(){ ov.classList.remove('open'); ov.setAttribute('aria-hidden','true'); }
  ov.addEventListener('click', function(e){ if(e.target===ov) closeSignin(); });

  document.getElementById('acctBtn').addEventListener('click', openSignin);

  // Until signed in, any category click routes to sign-in first (the "must sign in" behavior).
  document.getElementById('cats').addEventListener('click', function(e){
    var t=e.target.closest('[data-cat]'); if(!t) return;
    if(!SIGNED_IN){ openSignin(); return; }
    // Browse view wired in the next build increment (store.js).
  });
  document.getElementById('cartBtn').addEventListener('click', function(){ if(!SIGNED_IN) openSignin(); });

  // Sign-in stub: accepts a numeric student number for now; roster validation + contact confirm
  // + eligibility gate are wired to /api/camera/lookup in the next increment.
  function doSignin(){
    var v=(document.getElementById('sid').value||'').replace(/\D/g,''); var m=document.getElementById('signinMsg');
    if(v.length<5){ m.className='sheet-msg err'; m.textContent='Enter your student number.'; return; }
    try{ sessionStorage.setItem('pv_sid', v); }catch(e){}
    SIGNED_IN=true;
    document.getElementById('acctBtn').classList.add('in');
    m.className='sheet-msg ok'; m.textContent='Signed in.';
    setTimeout(closeSignin, 400);
  }
  document.getElementById('signinGo').addEventListener('click', doSignin);
  document.getElementById('sid').addEventListener('keydown', function(e){ if(e.key==='Enter') doSignin(); });
  if(SIGNED_IN) document.getElementById('acctBtn').classList.add('in');
})();
</script>
</body>
</html>
